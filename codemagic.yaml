workflows:
  android-debug:
    name: Android build (debug, do bezpośredniej instalacji na telefon)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Pobierz zależności Fluttera
        script: |
          flutter pub get

      - name: Wygeneruj pliki bazy danych (Drift)
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Zbuduj APK (debug)
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  ios-altstore:
    name: iOS build (bez podpisu, do AltStore)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable

    scripts:
      - name: Pobierz zależności Fluttera
        script: |
          flutter clean
          flutter pub get

      - name: Wygeneruj pliki bazy danych (Drift)
        script: |
          dart run build_runner build --delete-conflicting-outputs

      # UWAGA: świadomie NIE ma tu już kroku "flutter create . --platforms=ios".
      # Ten krok regenerował cały folder ios/ od zera przy KAŻDYM buildzie,
      # co po cichu cofało nazwę pakietu, wersję iOS, nazwę appki i kasowało
      # GoogleService-Info.plist - dokładnie to sprzątałyśmy ręcznie. Appka
      # buduje się poprawnie bez tego kroku - "flutter build ios" sam radzi
      # sobie z CocoaPods w tle, i sam odczytuje właściwą minimalną wersję
      # iOS wprost z ustawień projektu (IPHONEOS_DEPLOYMENT_TARGET w
      # ios/Runner.xcodeproj/project.pbxproj) - nie trzeba jej już osobno
      # wymuszać w Podfile na etapie builda.

      - name: Zbuduj niepodpisaną aplikację iOS
        script: |
          flutter build ios --release --no-codesign

      - name: Spakuj do pliku .ipa
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r Garderoba.ipa Payload

    artifacts:
      - build/ios/iphoneos/Garderoba.ipa
