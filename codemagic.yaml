workflows:
  ios-altstore:
    name: iOS build (bez podpisu, do AltStore)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Pobierz zależności Fluttera
        script: |
          flutter pub get
      - name: Zbuduj niepodpisaną aplikację iOS
        script: |
          flutter build ios --release --no-codesign
      - name: Spakuj do pliku .ipa
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r Garderoba.ipa Payload
    artifacts:
      - build/ios/iphoneos/Garderoba.ipa
