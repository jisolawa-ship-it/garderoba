workflows:
  android-debug:
    name: Android build (debug, do bezpośredniej instalacji na telefon)
    max_build_duration: 30
    instance_type: linux
    environment:
      flutter: stable
    scripts:
      - name: Pobierz zależności Fluttera
        script: |
          flutter pub get
      - name: Wygeneruj pliki bazy danych (Drift)
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Zbuduj APK (debug)
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  ios-altstore:
    name: iOS build (bez podpisu, do AltStore)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Pobierz zależności Fluttera
        script: |
          flutter pub get
      - name: Wygeneruj pliki bazy danych (Drift)
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Zainstaluj zależności CocoaPods
        script: |
          cd ios && pod install
      - name: Zbuduj niepodpisaną aplikację iOS
        script: |
          flutter build ios --release --no-codesign
      - name: Spakuj do pliku .ipa
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r Garderoba.ipa Payload
    artifacts:
      - build/ios/iphoneos/Garderoba.ipa
