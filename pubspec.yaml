name: garderoba
description: Aplikacja do zarządzania garderobą - katalog ubrań, planowanie stylizacji i analiza opłacalności zakupów.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/wardrobe_bg.jpg
    - assets/images/summary_header.jpg
    - assets/images/outfits_empty.jpg
    - assets/images/summary_box.jpg
